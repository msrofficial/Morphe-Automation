name: Build
on:
  workflow_call:
    inputs:
      force_full_rebuild:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      build_matrix: ${{ steps.check.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_FULL_REBUILD: ${{ inputs.force_full_rebuild }}
        run: python scripts/check_updates.py
  build-apps:
    needs: check
    if: needs.check.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.check.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install deps
        run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y zip unzip
      - name: Ensure keystore
        run: |
          if [ ! -f keystore/unified.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/unified.jks -alias morphe -keyalg RSA -keysize 2048 -validity 10950 -storepass morphe -keypass morphe -dname "CN=Morphe-Automation"
          fi
      - name: Build
        env:
          APP_NAME: ${{ matrix.app_name }}
          SOURCE: ${{ matrix.source }}
          ARCH: ${{ matrix.arch }}
          MODE: ${{ matrix.mode }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ github.run_number }}
        run: |
          mkdir -p build temp build_records
          python -m src
          # remove stock leftovers (com.google.* etc) so only final outputs are recorded
          rm -f com.*.apk com.*.apkm 2>/dev/null || true
          for f in *-morphe-*.apk build/*.apk build/*.zip; do
            [ -f "$f" ] || continue
            APK_PATH="$f" python scripts/record_build.py || true
          done
          if [ -z "$(ls -A build 2>/dev/null)" ] && [ -z "$(ls *-morphe-*.apk 2>/dev/null)" ]; then echo "BUILD FAILED: no final outputs"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.app_name }}-${{ matrix.source }}-${{ matrix.arch }}-${{ matrix.mode }}
          path: |
            *-morphe-*.apk
            build/*.apk
            build/*.zip
            build_records/
          if-no-files-found: error
  release:
    needs: [check, build-apps]
    if: needs.check.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./all
          pattern: out-*
      - name: Collect + manifest
        run: |
          mkdir -p release-apks build_records
          find ./all -type f \( -name "*-morphe-*.apk" -o -name "*-module-*.zip" -o -name "build/*.apk" \) -exec cp -f {} release-apks/ \; || true
          # drop any stock leftovers that slipped in
          rm -f release-apks/com.*.apk release-apks/com.*.apkm 2>/dev/null || true
          find ./all -path "*build_records/*.json" -exec cp -f {} build_records/ \; || true
          ls -la release-apks/ || echo "empty"
          # carry history: previous manifest from update branch becomes merge base
          git fetch origin update:update-ref 2>/dev/null || true
          if git show update-ref:manifest.json > new_manifest.json 2>/dev/null; then
            echo "carried manifest history from update branch"
          else
            rm -f new_manifest.json
          fi
          python scripts/merge_manifest.py || true
          cp -f manifest.json release-apks/ 2>/dev/null || true
          : > keep.txt
          for f in release-apks/*.apk release-apks/*.zip; do [ -f "$f" ] && basename "$f" >> keep.txt; done || true
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ github.run_number }}"
          if [ -z "$(ls -A release-apks 2>/dev/null)" ]; then echo "nothing to release"; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-apks/* --clobber
          else
            gh release create "$TAG" release-apks/* --title "Morphe-Automation $TAG" --notes "Auto build $TAG" --latest=false
          fi
          python scripts/cleanup_old.py --release "$TAG" --keep-file keep.txt || true
          git checkout -f update 2>/dev/null || git switch --discard-changes --orphan update
          cp -f manifest.json ./manifest.json 2>/dev/null || echo '{"entries":{}}' > manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "manifest $TAG" || echo "no changes"
          git push origin HEAD:update || true
          echo "TAG=$TAG" >> $GITHUB_ENV
      - name: Notify Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: |
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "Telegram secrets not set, skipping notify"
            exit 0
          fi
          REPO="${{ github.repository }}"
          TAG="$TAG"
          NL=$'\n'
          MSG="Morphe-Automation $TAG published${NL}${NL}"
          for f in release-apks/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            # skip manifest helper file
            if [ "$name" = "manifest.json" ]; then continue; fi
            url="https://github.com/${REPO}/releases/download/${TAG}/${name}"
            MSG+="- ${url}${NL}"
          done
          [ "$MSG" = "Morphe-Automation $TAG published${NL}${NL}" ] && MSG+="- (no files)"
          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${MSG}" || true
