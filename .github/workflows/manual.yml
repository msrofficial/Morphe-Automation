name: Manual Build
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App name'
        required: true
        default: 'youtube'
      source:
        description: 'Source'
        required: true
        default: 'morphe'
      arch:
        description: 'Arch'
        default: 'arm64-v8a'
        type: choice
        options: [arm64-v8a, armeabi-v7a, universal]
      mode:
        description: 'Mode'
        default: 'apk'
        type: choice
        options: [apk, module, both]
jobs:
  manual:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: |
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y zip unzip
      - name: Ensure keystore
        run: |
          if [ ! -f keystore/unified.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/unified.jks -alias morphe -keyalg RSA -keysize 2048 -validity 10950 -storepass morphe -keypass morphe -dname "CN=Morphe-Automation"
          fi
      - name: Build
        env:
          APP_NAME: ${{ inputs.app_name }}
          SOURCE: ${{ inputs.source }}
          ARCH: ${{ inputs.arch }}
          MODE: ${{ inputs.mode }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ github.run_number }}
        run: |
          mkdir -p build temp build_records
          if [ "${{ inputs.mode }}" = "both" ]; then
            MODE=apk python -m src
            MODE=module python -m src
          else
            python -m src
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: manual-${{ inputs.app_name }}-${{ inputs.arch }}-${{ inputs.mode }}
          path: |
            *-morphe-*.apk
            build/*.apk
            build/*.zip
          if-no-files-found: error
